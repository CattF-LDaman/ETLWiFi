[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etlwifi"
version = "0.2.0"
description = "Passive WiFi capture and medallion pipeline feeding a live neighbourhood dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20,<3",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
capture = ["scapy>=2.5"]
notebooks = ["duckdb>=1.0", "jupyter", "matplotlib", "scikit-learn"]
dev = ["pytest>=8", "ruff>=0.6", "scapy>=2.5"]

[project.scripts]
etlwifi = "etlwifi.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401"]
