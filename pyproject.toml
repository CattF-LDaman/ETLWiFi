[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etlwifi"
version = "0.1.0"
description = "Medallion pipeline for passive WiFi neighborhood monitoring data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=14.0",
    "duckdb>=1.0",
]

[project.scripts]
etlwifi = "etlwifi.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
